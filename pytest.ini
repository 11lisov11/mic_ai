[pytest]
addopts = --basetemp=.tmp_pytest/pytest-basetemp
asyncio_default_fixture_loop_scope = function
markers =
    slow: long-running training, reproduction, or release-packaging checks excluded from the fast profile.
    hardware: requires physical UNO Q, STM32U585, inverter, or motor hardware.
filterwarnings =
    ignore:The configuration option "asyncio_default_fixture_loop_scope" is unset:pytest.PytestDeprecationWarning
