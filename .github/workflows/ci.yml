name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Validate PGUPS Paper Tables
        run: |
          pip install -r requirements-paper.txt
          python tools/validate_pgups_study.py
      - name: Benchmark smoke (rule-based MIC)
        run: |
          python -m mic_ai.tools.run_benchmark \
            --env-config config/env_demo_true_motor1_nominal.py \
            --out-dir outputs/bench_ci_smoke \
            --mic-id-ref-low 1.0 --mic-id-ref-high 1.4 \
            --mic-id-ref-speed-tol-rel 0.05 --mic-id-ref-omega-min 0.1 \
            --scenarios speed_step:0.2 \
            --t-end 0.4 --dt 0.002 \
            --window-frac 0.5 \
            --error-tol-rel 0.05 --error-tol-abs 0.0 \
            --min-power-saving-pct -100 \
            --no-require-err-ok \
            --baseline-summary benchmarks/baseline_summary_ci.json \
            --compare-max-err-rel 0.1 \
            --compare-max-power-rel 0.1

  step27-smoke:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Step27 smoke (rule mode)
        run: |
          python tools/step27_pipeline.py \
            --motors air56 \
            --seeds 101 \
            --scenarios speed_step \
            --skip-air56-tune \
            --mic-mode rule \
            --out-dir outputs/ci_step27_smoke
      - name: Validate step27 artifacts
        run: |
          test -f outputs/ci_step27_smoke/step27_per_seed_metrics.csv
          test -f outputs/ci_step27_smoke/step27_stats_motor_controller.csv
          test -f outputs/ci_step27_smoke/step27_final_pi_vs_foc_vs_mic.csv
          test -f outputs/ci_step27_smoke/step27_air56_acceptance.json
          test -f outputs/ci_step27_smoke/step27_reproducibility.json
          test -f outputs/ci_step27_smoke/step27_report.md

  step28-summary-smoke:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Step28 summary smoke test
        run: pytest -q tests/test_step28_summary_smoke.py

  plan-completion-smoke:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Plan completion smoke test
        run: pytest -q tests/test_report_plan_completion_smoke.py

  theory-validation-smoke:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Theory validation smoke
        run: |
          python tools/validate_theory_working_characteristics.py \
            --csv paper/pgups_2026/fig/working_characteristics_air56_foc_mic_table.csv \
            --out-json outputs/theory_validation_ci/report.json \
            --out-md outputs/theory_validation_ci/report.md
      - name: Validate theory report artifacts
        run: |
          test -f outputs/theory_validation_ci/report.json
          test -f outputs/theory_validation_ci/report.md

  ieee-frozen-verify:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify frozen IEEE submission candidate
        run: |
          python tools/verify_ieee_submission_candidate.py \
            --step28-dir paper/ieee_2026/data/step28/20260303_ai_config_locked_nodrift \
            --ieee-root paper/ieee_2026 \
            --manuscript paper/ieee_2026/manuscript.md \
            --guardrails-policy paper/ieee_2026/guardrails_policy.json \
            --allow-dirty \
            --strict
      - name: Verify frozen IEEE submission candidate via wrapper
        run: |
          chmod +x scripts/verify_ieee_submission_candidate.sh
          ./scripts/verify_ieee_submission_candidate.sh \
            paper/ieee_2026/data/step28/20260303_ai_config_locked_nodrift \
            paper/ieee_2026 \
            paper/ieee_2026/guardrails_policy.json \
            paper/ieee_2026/manuscript.md
      - name: Verify frozen IEEE submission candidate via PowerShell wrapper
        shell: pwsh
        run: |
          ./scripts/verify_ieee_submission_candidate.ps1 `
            -Step28Dir paper/ieee_2026/data/step28/20260303_ai_config_locked_nodrift `
            -IeeeRoot paper/ieee_2026 `
            -GuardrailsPolicy paper/ieee_2026/guardrails_policy.json `
            -Manuscript paper/ieee_2026/manuscript.md `
            -AllowDirty
      - name: Step28 summary regression guard (frozen baseline)
        run: |
          python tools/check_step28_summary_regression.py \
            --summary-csv paper/ieee_2026/data/step28/20260303_ai_config_locked_nodrift/step28_ieee_summary.csv \
            --baseline-json benchmarks/step28_ieee_summary_baseline_20260303_ai_config_locked_nodrift.json \
            --strict
      - name: Build frozen IEEE release notes
        run: |
          python tools/build_ieee_release_notes.py \
            --step28-dir paper/ieee_2026/data/step28/20260303_ai_config_locked_nodrift \
            --ieee-root paper/ieee_2026 \
            --tag 20260303_ai_config_locked_nodrift \
            --strict
      - name: Build camera-ready checklist
        run: |
          python tools/build_ieee_camera_ready_checklist.py \
            --step28-dir paper/ieee_2026/data/step28/20260303_ai_config_locked_nodrift \
            --ieee-root paper/ieee_2026 \
            --tag 20260303_ai_config_locked_nodrift \
            --strict
      - name: Build rebuttal evidence pack
        run: |
          python tools/build_ieee_rebuttal_evidence_pack.py \
            --step28-dir paper/ieee_2026/data/step28/20260303_ai_config_locked_nodrift \
            --ieee-root paper/ieee_2026 \
            --tag 20260303_ai_config_locked_nodrift \
            --strict
