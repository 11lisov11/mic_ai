name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Benchmark smoke (rule-based MIC)
        run: |
          python -m mic_ai.tools.run_benchmark \
            --env-config config/env_demo_true_motor1_nominal.py \
            --out-dir outputs/bench_ci_smoke \
            --mic-id-ref-low 1.0 --mic-id-ref-high 1.4 \
            --mic-id-ref-speed-tol-rel 0.05 --mic-id-ref-omega-min 0.1 \
            --scenarios speed_step:0.2 \
            --t-end 0.4 --dt 0.002 \
            --window-frac 0.5 \
            --error-tol-rel 0.05 --error-tol-abs 0.0 \
            --min-power-saving-pct -100 \
            --no-require-err-ok \
            --baseline-summary benchmarks/baseline_summary_ci.json \
            --compare-max-err-rel 0.1 \
            --compare-max-power-rel 0.1
