[platformio]
src_dir = .
include_dir = .
default_envs = air56_unoq_stm32u585_mock

[env]
platform = ststm32
board = disco_b_u585i_iot02a
framework = arduino
monitor_speed = 115200

[env:air56_unoq_stm32u585_mock]
build_flags =
  -DAIR56_UNOQ_USE_MOCK_HW=1

; Production target intentionally does not enable AIR56_UNOQ_USE_MOCK_HW.
; Add the board-side implementation of air56_foc_* symbols before building
; this env against a motor-connected STM32U585 project.
[env:air56_unoq_stm32u585_port]
build_flags =
  -DAIR56_UNOQ_PRODUCTION_PORT=1
